                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: srqms_session
  parameters:
    Locale:
      in: query
      name: locale
      schema: { type: string, enum: [en, ta, te, hi], default: en }
    ShopId:
      in: path
      name: shopId
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      in: path
      name: tokenId
      required: true
      schema: { type: string, format: uuid }
    RequestIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 120 }
    RequestIdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 8, maxLength: 120 }
  responses:
    ValidationError:
      description: Request schema validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication required or session invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated role is not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found or not available to this user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: State conflict, duplicate active token, busy counter or replay conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BusinessRuleFailure:
      description: Business rule failed, including insufficient inventory
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Rate limit reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Service dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    HealthResponse:
      type: object
      required: [status, requestId]
      properties:
        status: { type: string, const: ok }
        requestId: { type: string }
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, failed, skipped] }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
    CardCategory:
      type: string
      enum: [AAY, PHH, NPHH, OTHER_DEMO]
    QueueStatus:
      type: string
      enum: [WAITING, SERVING, COMPLETED, CANCELLED, NO_SHOW]
    ComplaintStatus:
      type: string
      enum: [RECEIVED, IN_REVIEW, RESOLVED, CLOSED]
    Shop:
      type: object
      required: [id, shopCode, name, district, address, isDemo, isActive]
      properties:
        id: { type: string, format: uuid }
        shopCode: { type: string }
        name: { type: string }
        district: { type: string }
        taluk: { type: [string, 'null'] }
        locality: { type: [string, 'null'] }
        address: { type: string }
        pincode: { type: [string, 'null'] }
        phoneDisplay: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        openingHours: { type: object, additionalProperties: { type: string } }
        isDemo: { type: boolean, const: true }
        isActive: { type: boolean }
    ShopInput:
      type: object
      required: [shopCode, name, district, address]
      properties:
        shopCode: { type: string, minLength: 3, maxLength: 40 }
        name: { type: string, minLength: 3, maxLength: 180 }
        district: { type: string, minLength: 2, maxLength: 100 }
        taluk: { type: [string, 'null'], maxLength: 100 }
        locality: { type: [string, 'null'], maxLength: 120 }
        address: { type: string, minLength: 3, maxLength: 1000 }
        pincode: { type: [string, 'null'], pattern: '^\\d{6}$' }
        phoneDisplay: { type: [string, 'null'], maxLength: 40 }
        openingHours: { type: object, additionalProperties: { type: string } }
    PaginatedShops:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Shop' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Commodity:
      type: object
      required: [id, code, name, unit, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        nameI18n: { type: object, additionalProperties: { type: string } }
        unit: { type: string }
        isActive: { type: boolean }
    PolicyRule:
      type: object
      required: [id, ruleCode, version, cardCategory, commodityId, ruleConfig, validFrom, isDemo]
      properties:
        id: { type: string, format: uuid }
        ruleCode: { type: string }
        version: { type: integer }
        cardCategory: { $ref: '#/components/schemas/CardCategory' }
        commodityId: { type: string, format: uuid }
        district: { type: [string, 'null'] }
        ruleConfig: { type: object, additionalProperties: true }
        explanationI18n: { type: object, additionalProperties: { type: string } }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceNote: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        isDemo: { type: boolean }
    PolicyRuleInput:
      type: object
      required: [ruleCode, version, cardCategory, commodityId, ruleConfig, validFrom, isDemo, sourceNote]
      properties:
        ruleCode: { type: string, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        cardCategory: { $ref: '#/components/schemas/CardCategory' }
        commodityId: { type: string, format: uuid }
        district: { type: [string, 'null'], maxLength: 100 }
        ruleConfig: { type: object, additionalProperties: true }
        explanationI18n: { type: object, additionalProperties: { type: string } }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceNote: { type: string, minLength: 3, maxLength: 1000 }
        verifiedAt: { type: [string, 'null'], format: date-time }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        isDemo: { type: boolean }
    InventoryItem:
      type: object
      required: [shopId, commodity, quantityAvailable, reorderLevel, isDemo, updatedAt]
      properties:
        shopId: { type: string, format: uuid }
        commodity: { $ref: '#/components/schemas/Commodity' }
        quantityAvailable: { type: number, minimum: 0 }
        reorderLevel: { type: number, minimum: 0 }
        isLowStock: { type: boolean }
        isDemo: { type: boolean, const: true }
        updatedAt: { type: string, format: date-time }
    DemoVerification:
      type: object
      required: [verificationId, expiresAt, card, isDemo]
      properties:
        verificationId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        isDemo: { type: boolean, const: true }
        card:
          type: object
          required: [cardNumberMasked, category, headName, familyMembers, shopId]
          properties:
            cardNumberMasked: { type: string }
            category: { $ref: '#/components/schemas/CardCategory' }
            headName: { type: string }
            familyMembers: { type: integer }
            shopId: { type: string, format: uuid }
            shopName: { type: string }
    QueueTokenPublic:
      type: object
      required: [id, tokenNumber, shopId, serviceDate, status, position, customersAhead, estimatedWaitMinutes, estimateMethod, isDemo, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tokenNumber: { type: string }
        shopId: { type: string, format: uuid }
        shopName: { type: string }
        serviceDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/QueueStatus' }
        counterNo: { type: [integer, 'null'] }
        position: { type: integer, minimum: 0 }
        customersAhead: { type: integer, minimum: 0 }
        estimatedWaitMinutes: { type: integer, minimum: 0 }
        estimateMethod: { type: string, const: demo_average_service_minutes }
        isDemo: { type: boolean, const: true }
        updatedAt: { type: string, format: date-time }
    QueueTokenStaff:
      allOf:
        - $ref: '#/components/schemas/QueueTokenPublic'
        - type: object
          properties:
            sequenceNo: { type: integer }
            cardNumberMasked: { type: string }
            beneficiaryName: { type: string }
            familyMembers: { type: integer }
            servingStartedAt: { type: [string, 'null'], format: date-time }
            completedAt: { type: [string, 'null'], format: date-time }
    StockChange:
      type: object
      required: [id, commodityId, transactionType, quantityDelta, quantityBefore, quantityAfter, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        commodityId: { type: string, format: uuid }
        commodityName: { type: string }
        transactionType: { type: string, enum: [RESTOCK, DISTRIBUTION, ADJUSTMENT, REVERSAL] }
        quantityDelta: { type: number }
        quantityBefore: { type: number }
        quantityAfter: { type: number }
        reason: { type: string }
        actorName: { type: string }
